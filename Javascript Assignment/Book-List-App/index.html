<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Book List App</h2>

        <div class="input-group">
            <input type="text" id="bookName" placeholder="📖 Book Name">
            <input type="text" id="authorName" placeholder="✍️ Author Name">
            <button id="saveBtn">Save Book</button>
        </div>

        <table border="1">
            <thead>
                <tr>
                    <th>Book</th>
                    <th>Author</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookList"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
